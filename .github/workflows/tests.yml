name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage / report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the stockpiler tests with coverage
        run: |
          uv run --python 3.12 --no-project --isolated \
            --with pytest --with pytest-cov \
            pytest --cov stockpiler --cov catalog \
            --cov-branch --tb=short -p no:cacheprovider -q tests
